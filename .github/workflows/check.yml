name: App checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/training-browser-check.py
      - run: python scripts/database-browser-check.py
      - run: python scripts/iphone-layout-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-browser-checks
          path: .artifacts/
          if-no-files-found: ignore
